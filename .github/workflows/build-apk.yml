name: Build RealShot AI Camera APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          ./gradlew assembleDebug --no-daemon
          mkdir -p apk_output
          cp app/build/outputs/apk/debug/app-debug.apk apk_output/RealShot-AI-Camera-debug.apk
          echo "Debug APK generated successfully:"
          ls -lh apk_output/RealShot-AI-Camera-debug.apk

      - name: Decode Keystore & Build Release APK (Optional)
        if: "${{ github.event.inputs.build_type == 'release' && env.KEYSTORE_BASE64 != '' }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          export KEYSTORE_PATH=$(pwd)/my-upload-key.jks
          ./gradlew assembleRelease --no-daemon
          mkdir -p apk_output
          cp app/build/outputs/apk/release/app-release.apk apk_output/RealShot-AI-Camera-release.apk

      - name: Upload RealShot AI Camera APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealShot-AI-Camera-APK
          path: apk_output/*.apk
          retention-days: 30
          if-no-files-found: error
