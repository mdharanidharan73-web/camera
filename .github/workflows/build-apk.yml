name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Verify Android SDK packages
        run: |
          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          echo "Android SDK ready:"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36\.1|build-tools;36\.0\.0' || true

      - name: Inspect project
        run: |
          pwd
          ls -la
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Locate APK
        run: find . -type f -name "*.apk" -print

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/RealShot-AI-Camera.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealShot-AI-Camera-APK
          path: app/build/outputs/apk/debug/RealShot-AI-Camera.apk
          if-no-files-found: error
